# The API and worker share one built image; only the command differs so Task 3 proves
# process-role separation without creating another source application.
x-cdms-app: &cdms-app
  build:
    context: .
    target: production
  image: ksynerx-cdms:local
  environment: &cdms-env
    PORT: 3000
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    DATABASE_NAME: cdms
    DATABASE_USER: cdms
    DATABASE_PASSWORD: cdms_demo_password
    REDIS_HOST: redis
    REDIS_PORT: 6379
    POLL_INTERVAL_MS: 5000
    INVENTORY_SEED_COUNT: 1000
    IMPORT_BATCH_SIZE: 500
    IMPORT_MAX_PENDING_BATCHES: 100
    IMPORT_MAX_FILE_SIZE_MB: 100
    IMPORT_REDIS_RETRY_TIMEOUT_MS: 30000
    CHANGE_WORKER_CONCURRENCY: 10
    OUTBOX_BATCH_SIZE: 100
    OUTBOX_POLL_INTERVAL_MS: 1000
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdms
      POSTGRES_USER: cdms
      POSTGRES_PASSWORD: cdms_demo_password
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # AOF everysec improves ordinary restart recovery for Redis-backed queues, but the
    # SPEC's catastrophic Redis data-loss limitation still applies.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  cdms:
    <<: *cdms-app
    command: ["node", "dist/main.js"]
    ports:
      - "3000:3000"

  worker:
    <<: *cdms-app
    command: ["node", "dist/worker.js"]

volumes:
  postgres-data:
  redis-data:
